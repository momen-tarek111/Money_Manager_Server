# 1. Dynamic Database Configuration
# Uses cloud database URL if provided, otherwise defaults to local MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/moneymanager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:zamaleksc}

# 2. Server Port & Context Path
# Render passes the public port dynamically via $PORT
server.port=${PORT:8080}
server.servlet.context-path=/api/v1.0

# 3. JPA / Hibernate Configuration
# Use 'update' for dev; in production, 'none' or 'validate' is safer
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 4. Email Configuration (Brevo)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=${BREVO_FROM_EMAIL}

# 5. Security & JWT Configuration
jwt.secret=${JWT_SECRET:fgdfjgjfdgsdkjfsjrdflkjgdferwerhdsfhbrqho}
jwt.expiration=86400000

# 6. Frontend & Backend URLs
money.manager.frontend.url=${MONEY_MANAGER_FRONTEND_URL:http://localhost:3000}
app.activation.url=${MONEY_MANAGER_BACKEND_URL:http://localhost:8080}